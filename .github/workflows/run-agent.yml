name: Run Short Squeeze Agent

on:
  schedule:
    # Runs every 10 minutes between 13:30 UTC and 20:00 UTC (9:30 AM - 4:00 PM EST), Mon-Fri
    - cron: '*/10 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install -r requirements.txt

      - name: Run Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python agent.py
